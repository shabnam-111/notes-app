{% extends "base.html" %}
{% block title %}Sign in · Notes{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="flash err" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username <input name="username" value="{{ username }}" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('web.register') }}">Create one</a>.</p>
</section>
{% endblock %}
