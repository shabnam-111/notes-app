{% extends "base.html" %}
{% block title %}Create account · Notes{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" value="{{ username }}" autocomplete="username" required>
      {% if errors.username %}<span class="field-err">{{ errors.username }}</span>{% endif %}
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password" required>
      {% if errors.password %}<span class="field-err">{{ errors.password }}</span>{% endif %}
    </label>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('web.login') }}">Sign in</a>.</p>
</section>
{% endblock %}
