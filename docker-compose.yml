
services:
  # ---------------------------------------------
  # PostgreSQL 16 Relational Database
  # ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindvault_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindvault_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-mindvault_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindvault_admin} -d ${POSTGRES_DB:-mindvault_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # Redis 7 In-Memory Cache & Message Broker
  # ---------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # Qdrant Vector Database
  # ---------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------
  # Python 3.11 FastAPI AI & Document Service
  # ---------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - AI_PORT=8000
      - AI_HOST=0.0.0.0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=mindvault_vectors
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads:ro
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:8000/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------
  # Node.js + Express Backend API
  # ---------------------------------------------
  database-init:
    build:
      context: ./backend
      target: database-init
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindvault_admin}:${POSTGRES_PASSWORD:-mindvault_secure_password}@postgres:5432/${POSTGRES_DB:-mindvault_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=4000
      - CORS_ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mindvault_admin}:${POSTGRES_PASSWORD:-mindvault_secure_password}@postgres:5432/${POSTGRES_DB:-mindvault_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_access_token_key_change_in_production_12345}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_token_key_change_in_production_67890}
      - AI_SERVICE_URL=http://ai-service:8000
      - UPLOAD_DIR=/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
      database-init:
        condition: service_completed_successfully

  # ---------------------------------------------
  # Next.js 14 Frontend Web Client
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
  qdrant_data:
  uploads_data:
